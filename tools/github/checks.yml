# 仓库自检（GitHub Actions）
#
# 注意：这个文件**故意没有放在 .github/workflows/ 下**。
# 推送到 .github/workflows/ 需要 token 具备 `workflow` scope，否则 push 会被拒绝：
#   refusing to allow an OAuth App to create or update workflow ...
#
# 启用方式（任选其一）：
#   1) gh auth refresh -s workflow
#      git mv tools/github/checks.yml .github/workflows/checks.yml
#      git commit -m "ci: 启用检查" && git push
#   2) 在 GitHub 网页上新建 .github/workflows/checks.yml，粘贴本文件内容
#
# 内容说明：
# 刻意**不在 CI 里构建 APK** —— 构建需要下载 Android build-tools + platform（几百 MB），
# 在 CI 里性价比很低；本地跑一条 build.ps1 即可（见 docs/build.md）。
# 这里只跑两条能在几分钟内给出结论的检查：
#   - protocol/selftest.ps1 : 协议层断言 + 手写 WebSocket 的端到端测试
#   - tools/lint-app.ps1    : "编译通过但真机才炸"的静态规则
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol-and-lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # protocol/selftest.ps1 会先找 toolchain/jdk，找不到就用 PATH 上的 JDK
      - name: Install ws (only the mux/WebSocket suite needs it)
        run: npm install ws --prefix protocol --no-save --no-package-lock

      - name: Protocol self-tests (assertion count is printed, plus WebSocket end-to-end)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File protocol/selftest.ps1

      - name: App static checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/lint-app.ps1
