# 持续集成：自检 + 打包 APK（每次 push / PR）
#
# 放在 tools/github/ 而不是 .github/workflows/ 的原因见 README.md —— 推送
# workflow 文件需要 token 具备 `workflow` scope。启用方式同样见该 README。
#
# 这个 workflow 会**真的把 APK 打出来**并作为 artifact 上传，
# 所以每次提交都能从 Actions 页面直接下载对应版本的安装包。
name: ci

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安装 Android SDK（build-tools 34 + platform 34）；build.ps1 会自动读 ANDROID_SDK_ROOT
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Protocol self-tests (assertion count is printed)
        run: |
          npm install ws --prefix protocol --no-save --no-package-lock
          powershell -NoProfile -ExecutionPolicy Bypass -File protocol/selftest.ps1

      - name: App static checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/lint-app.ps1

      - name: Build APK
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -VersionCode ${{ github.run_number }} -OutName dsh-mobile-debug.apk

      - name: Show APK info
        run: |
          $env:PATH = "$env:ANDROID_SDK_ROOT\build-tools\34.0.0;$env:PATH"
          aapt2 dump badging dist/dsh-mobile-debug.apk | Select-String 'package:'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: dist/dsh-mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
