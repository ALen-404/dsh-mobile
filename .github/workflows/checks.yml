# 仓库自检：协议层自检 + App 静态检查
#
# 刻意**不在 CI 里构建 APK**：构建需要下载 Android build-tools + platform（约几百 MB），
# 在 CI 里做性价比很低。本地一条 build.ps1 即可（见 docs/build.md）。
#
# 这两个 job 覆盖的是"能在几分钟内给出结论"的部分：
#   - protocol/selftest.ps1 : 151 项断言 + 手写 WebSocket 的端到端测试
#   - tools/lint-app.ps1    : 6 条"编译通过但真机才炸"的静态规则
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol-and-lint:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # protocol/selftest.ps1 会自己找 toolchain/jdk，找不到就用 PATH 上的 JDK
      - name: Install ws (only the mux/WebSocket suite needs it)
        run: npm install ws --prefix protocol --no-save --no-package-lock

      - name: Protocol self-tests (assertion count is printed, plus WebSocket end-to-end)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File protocol/selftest.ps1

      - name: App static checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/lint-app.ps1
