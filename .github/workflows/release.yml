# 发布：打 tag 时自动构建对应版本并创建 Release（含 APK 附件）
#
# 用法：
#   git tag v0.2.0 && git push origin v0.2.0
# → Actions 会用 tag 里的版本号构建 APK，并创建 GitHub Release 附上安装包
#
# 放在 tools/github/ 的原因见 README.md（推送 workflow 文件需要 workflow scope）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 0.2.0'
        required: true

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "building version $VER"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Protocol self-tests
        run: |
          npm install ws --prefix protocol --no-save --no-package-lock
          powershell -NoProfile -ExecutionPolicy Bypass -File protocol/selftest.ps1

      - name: App static checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/lint-app.ps1

      - name: Build APK (version from tag)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 `
            -VersionName "${{ steps.ver.outputs.version }}" `
            -VersionCode ${{ github.run_number }} `
            -OutName "dsh-mobile-${{ steps.ver.outputs.version }}.apk"

      - name: Show APK info
        run: |
          $env:PATH = "$env:ANDROID_SDK_ROOT\build-tools\34.0.0;$env:PATH"
          aapt2 dump badging "dist/dsh-mobile-${{ steps.ver.outputs.version }}.apk" | Select-String 'package:'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: dist/dsh-mobile-${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          body: |
            ## dsh-mobile v${{ steps.ver.outputs.version }}

            非官方 DSH 移动客户端（Android）。APK 由 CI 自动构建，签名沿用仓库内的 debug keystore。

            安装：下载 `dsh-mobile-${{ steps.ver.outputs.version }}.apk`，允许「安装未知来源应用」后安装。
            验收清单：docs/device-checklist.md

            > 界面尚未在真机验证过（开发机无 adb）。协议层与附件链路已在真实 DSH 上实测。
